name: owner
description: "WalimApp Owner Application — Shared Android & Windows Venue Management"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  cupertino_icons: ^1.0.8
  drift: ^2.35.0
  sqlite3: ^3.5.2
  path: ^1.9.0
  path_provider: ^2.1.0
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  drift_dev: ^2.35.0
  build_runner: ^2.15.0
  flutter_lints: ^6.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

flutter:
  uses-material-design: true
  generate: true
